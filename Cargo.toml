[package]
name = "thock"
version = "0.1.0"
edition = "2021"

[dependencies]
crossbeam-channel = "0.5.17"
core-graphics = "0.23"
core-foundation = "0.9"
rodio = "0.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tao = "0.37.0"
tray-icon = "0.25.1"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
