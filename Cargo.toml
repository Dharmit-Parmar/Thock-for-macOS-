[package]
name = "thock"
version = "0.1.0"
edition = "2021"
default-run = "thock-app"

[dependencies]
crossbeam-channel = "0.5.17"
core-graphics = "0.23"
core-foundation = "0.9"
rodio = "0.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wry = "0.38.0"
tao = "0.28.0"
image = { version = "0.25", features = ["jpeg", "png"] }
muda = "0.20.0"
rustyline = { version = "18.0.1", features = ["derive"] }
mimalloc = "0.1.52"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
